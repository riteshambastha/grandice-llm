[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "grandice-privacy"
version = "0.1.0"
description = "Local-first privacy SDK and policy engine for Grandice APIs"
readme = "PRIVACY.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
sidecar = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
include = ["grandice_privacy*", "grandice_domain*"]

